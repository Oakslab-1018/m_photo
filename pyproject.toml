[project]
name = "m-photo-backend"
version = "0.1.0"
description = "FastAPI modular monolith backend for the AI geo-location app"
readme = "backend/README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0.30,<2.1",
    "pydantic>=2.7,<3.0",
    "pillow>=10.0.1",
    "python-multipart>=0.0.9",
    "alembic>=1.13,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
default-groups = ["dev"]
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = [".", "backend"]
