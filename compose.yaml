# m-photo 第一阶段：仅包含新的 Geo 定位系统（FastAPI + Vue/Nginx）。
# 旧 Flask 应用（app.py / login / game）不由本 Compose 启动。
name: m-photo

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: m-photo-backend:local
    environment:
      # 所有可写数据（SQLite + 上传图片）都落在具名卷内。
      M_PHOTO_DATA_DIR: /data
      # OCR runs in-process (PP-OCRv5 server det/cls/rec + ONNX Runtime CPU).
      GEO_AI_MODE: mock
      OCR_PROVIDER: ${OCR_PROVIDER:-rapidocr}
      OCR_MODEL_TYPE: ${OCR_MODEL_TYPE:-server}
      OCR_DEVICE: ${OCR_DEVICE:-cpu}
      OCR_GPU_URL: ${OCR_GPU_URL:-http://host.docker.internal:8003}
      GPUOCR_API_KEY: ${GPUOCR_API_KEY:-${STREETCLIP_API_KEY:-}}
      OCR_GPU_TIMEOUT_SECONDS: ${OCR_GPU_TIMEOUT_SECONDS:-60}
      OCR_CPU_INTRA_OP_THREADS: ${OCR_CPU_INTRA_OP_THREADS:-4}
      OCR_CPU_INTER_OP_THREADS: ${OCR_CPU_INTER_OP_THREADS:-1}
      # Model weights are cached on the named volume so restarts need no download.
      M_PHOTO_OCR_MODEL_DIR: /data/ocr-models
      OCR_MIN_TEXT_SCORE: ${OCR_MIN_TEXT_SCORE:-0.5}
      OCR_LANGUAGE_MIN_CONFIDENCE: ${OCR_LANGUAGE_MIN_CONFIDENCE:-0.7}
      # GPU inference runs in a separate host process, not this image.
      STREETCLIP_ENABLED: ${STREETCLIP_ENABLED:-false}
      STREETCLIP_URL: ${STREETCLIP_URL:-http://host.docker.internal:8001}
      STREETCLIP_API_KEY: ${STREETCLIP_API_KEY:-}
      STREETCLIP_TIMEOUT_SECONDS: ${STREETCLIP_TIMEOUT_SECONDS:-45}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-15}
      M_PHOTO_GEOCODER_ENABLED: ${M_PHOTO_GEOCODER_ENABLED:-true}
      M_PHOTO_GEOCODER_PROVIDER: ${M_PHOTO_GEOCODER_PROVIDER:-photon}
      M_PHOTO_GEOCODER_BASE_URL: ${M_PHOTO_GEOCODER_BASE_URL:-https://photon.komoot.io/api}
      M_PHOTO_GEOCODER_API_KEY: ${M_PHOTO_GEOCODER_API_KEY:-}
      M_PHOTO_GEOCODER_REFERER: ${M_PHOTO_GEOCODER_REFERER:-}
      M_PHOTO_GEOCODER_LANGUAGE: ${M_PHOTO_GEOCODER_LANGUAGE:-en}
      M_PHOTO_GEOCODER_TIMEOUT_SECONDS: ${M_PHOTO_GEOCODER_TIMEOUT_SECONDS:-6}
      M_PHOTO_GEOCODER_CONNECT_TIMEOUT_SECONDS: ${M_PHOTO_GEOCODER_CONNECT_TIMEOUT_SECONDS:-1.5}
      M_PHOTO_GEOCODER_MAX_ATTEMPTS: ${M_PHOTO_GEOCODER_MAX_ATTEMPTS:-3}
      M_PHOTO_GEOCODER_RETRY_BACKOFF_SECONDS: ${M_PHOTO_GEOCODER_RETRY_BACKOFF_SECONDS:-0.5}
      M_PHOTO_GEOCODER_KEEPALIVE_SECONDS: ${M_PHOTO_GEOCODER_KEEPALIVE_SECONDS:-60}
      M_PHOTO_GEOCODER_MIN_INTERVAL_SECONDS: ${M_PHOTO_GEOCODER_MIN_INTERVAL_SECONDS:-1}
      M_PHOTO_LOCAL_PLACE_INDEX: ${M_PHOTO_LOCAL_PLACE_INDEX:-/app/data/place-evidence.json}
      M_PHOTO_WEB_SEARCH_PROVIDER: ${M_PHOTO_WEB_SEARCH_PROVIDER:-none}
      M_PHOTO_WEB_SEARCH_BASE_URL: ${M_PHOTO_WEB_SEARCH_BASE_URL:-}
      M_PHOTO_WEB_SEARCH_API_KEY: ${M_PHOTO_WEB_SEARCH_API_KEY:-}
      M_PHOTO_WEB_SEARCH_TIMEOUT_SECONDS: ${M_PHOTO_WEB_SEARCH_TIMEOUT_SECONDS:-4}
      M_PHOTO_WEB_SEARCH_CONNECT_TIMEOUT_SECONDS: ${M_PHOTO_WEB_SEARCH_CONNECT_TIMEOUT_SECONDS:-1.5}
    volumes:
      - backend-data:/data
    expose:
      - "8000"
    healthcheck:
      # 用运行时自带的 Python urllib 探测，无需在镜像中额外安装 curl。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NODE_VERSION: "24"
        VITE_MAP_STYLE_URL: "${VITE_MAP_STYLE_URL:-}"
        VITE_MAPTILER_API_KEY: "${VITE_MAPTILER_API_KEY:-}"
    image: m-photo-frontend:local
    ports:
      # 第一阶段 geo 无用户鉴权：默认只绑定宿主机回环地址。
      # 仅在同一台机器内访问；如需局域网访问，用 BIND_ADDRESS/APP_PORT 覆盖。
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data: